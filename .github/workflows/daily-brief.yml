name: Daily AI Brief

on:
  schedule:
    # Run at 1:17 AM Eastern on weekdays, avoiding the start of the hour when GitHub warns scheduled runs may be delayed or dropped.
    - cron: "17 1 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      redo_story_links:
        description: "Optional JSON array of exact RSS story URLs to regenerate"
        required: false
        type: string
        default: ""
      remix_episode_filename:
        description: "Optional existing MP3 filename to re-render from its saved transcript"
        required: false
        type: string
        default: ""
      music_gain_percent:
        description: "Music bed gain relative to its baseline; 120 means 20% louder"
        required: false
        type: string
        default: "120"

permissions:
  contents: write

concurrency:
  group: daily-ai-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MP3 encoder
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends ffmpeg librsvg2-bin

      - name: Fetch previous podcast site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site \
            || mkdir -p site
          rm -rf site/.git
          rsvg-convert -w 1400 -h 1400 artwork.svg -o site/artwork.png

      - name: Build today's brief
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_DIR: site
          REDO_STORY_LINKS: ${{ github.event.inputs.redo_story_links || '' }}
          REMIX_EPISODE_FILENAME: ${{ github.event.inputs.remix_episode_filename || '' }}
          MUSIC_GAIN_PERCENT: ${{ github.event.inputs.music_gain_percent || '120' }}
        run: python3 brief.py

      - name: Add the touch-first web player
        run: |
          cp player/index.html site/index.html
          cp player/player.css site/player.css
          cp player/player.js site/player.js
          sed -i "s|href=\"player.css\"|href=\"player.css?v=${GITHUB_SHA}\"|" site/index.html
          sed -i "s|src=\"player.js\"|src=\"player.js?v=${GITHUB_SHA}\"|" site/index.html

      - name: Publish podcast feed and MP3s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init --quiet --initial-branch=gh-pages
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git commit --quiet -m "Brief $(date -u +%F)"
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Alert on persistent RSS source failures
        if: success() && steps.build.outputs.health_alert == 'true'
        run: |
          echo "::error title=Persistent RSS source failure::At least one feed failed on three consecutive runs. See the RSS source health table in this run's summary."
          exit 1
