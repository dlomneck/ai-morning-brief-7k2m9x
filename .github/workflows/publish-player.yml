name: Publish player

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fetch the current podcast site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          rm -rf site/.git
      - name: Install player files
        run: |
          cp player/index.html site/index.html
          cp player/player.css site/player.css
          cp player/player.js site/player.js
      - name: Publish player to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init --quiet --initial-branch=gh-pages
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The player is already current."
            exit 0
          fi
          git commit --quiet -m "Publish touch-first podcast player"
          git push --quiet --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
