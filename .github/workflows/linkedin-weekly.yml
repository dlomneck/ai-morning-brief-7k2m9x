name: Weekly LinkedIn draft email

on:
  # Manual only until email delivery and the weekly schedule are confirmed.
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the draft to the configured private recipient
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: linkedin-weekly
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check privacy and delivery behavior without external calls
        run: python -m unittest discover -s tests -p 'test_linkedin_weekly.py'
      - name: Generate and optionally email privately
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_FREE_TIER_CONFIRMED: ${{ vars.LINKEDIN_FREE_TIER_CONFIRMED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          LINKEDIN_EMAIL_TO: ${{ secrets.LINKEDIN_EMAIL_TO }}
          SEND_EMAIL: ${{ inputs.send_email }}
        run: |
          if [ "$SEND_EMAIL" = "true" ]; then
            python linkedin_weekly.py --send
          else
            python linkedin_weekly.py
          fi
